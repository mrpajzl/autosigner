# Docker Compose for development on non-macOS systems.
# NOTE: Signing will NOT work in Docker - use native macOS for full functionality.
# This is only useful for UI/API development and testing.

services:
  fastsigner-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: fastsigner-dev:latest
    working_dir: /app
    volumes:
      - .:/app:delegated
      - node_modules_cache:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:./prisma/dev.db
      - CRYPTO_SECRET=dev-secret-key-at-least-32-characters
      - PUBLIC_BASE_URL=http://localhost:3000
    command: ["npm", "run", "dev:local"]

volumes:
  node_modules_cache:
