[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"
# Prefer IPv4 to avoid IPv6 EHOSTUNREACH in some hosts
NODE_OPTIONS = "--dns-result-order=ipv4first"
HOST = "0.0.0.0"
PRISMA_LOG_LEVEL = "info"
DATABASE_URL = "file:/app/prisma/dev.db"

[phases.setup]
# Use modern Node/npm compatible with Nuxt 4 & deps
nixPkgs = ["nodejs_22", "openssl", "unzip", "zip", "python311", "curl"]
nixLibs = ["gcc-unwrapped"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "npm ci",
  "curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py",
  "python3 /tmp/get-pip.py",
  "python3 -m pip install --no-cache-dir isign==2.3.0"
]
cacheDirectories = ["/root/.npm", "/root/.cache/pip"]
paths = ["/app/node_modules/.bin"]

[phases.build]
dependsOn = ["install"]
cmds = ["npm run build"]
cacheDirectories = ["node_modules/.cache"]

[start]
cmd = "mkdir -p /app/prisma; npx prisma migrate deploy || true; npx prisma db push; node .output/server/index.mjs"


