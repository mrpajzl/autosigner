[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"
# Prefer IPv4 to avoid IPv6 EHOSTUNREACH in some hosts
NODE_OPTIONS = "--dns-result-order=ipv4first"
HOST = "0.0.0.0"
PRISMA_LOG_LEVEL = "info"
DATABASE_URL = "file:/app/prisma/dev.db"

[phases.setup]
# Use modern Node/npm compatible with Nuxt 4 & deps
nixPkgs = [
  "nodejs_22",
  "openssl",
  "python311",
  "python311Packages.pip",
  "python311Packages.setuptools",
  "python311Packages.wheel",
  "pkg-config",
  "libffi",
  "rustc",
  "cargo",
  "unzip",
  "zip"
]
nixLibs = ["gcc-unwrapped"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "npm ci",
  "python3 -m pip install --no-cache-dir --upgrade pip",
  "python3 -m pip install --no-cache-dir isign"
]
cacheDirectories = ["/root/.npm"]
paths = ["/app/node_modules/.bin"]

[phases.build]
dependsOn = ["install"]
cmds = ["npm run build"]
cacheDirectories = ["node_modules/.cache"]

[start]
cmd = "mkdir -p /app/prisma; npx prisma migrate deploy || true; npx prisma db push; node .output/server/index.mjs"


